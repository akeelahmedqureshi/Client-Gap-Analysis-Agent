# Local stack: PostgreSQL (with pgvector for the upcoming knowledge layer), API, web UI.
#   cp .env.example .env   # add CIP_OPENROUTER_API_KEY etc.
#   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: cip
      POSTGRES_DB: cip
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      CIP_DATABASE_URL: postgresql+asyncpg://cip:cip@db:5432/cip
      CIP_STORAGE_DIR: /app/storage
      CIP_CORS_ORIGINS: '["http://localhost:8080"]'
      CIP_OAUTH_REDIRECT_BASE: http://localhost:8080
    volumes: [storage:/app/storage]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  storage:

# Multilingual keyword packs for the capability taxonomy (multi-language analysis).
#
# Matched exactly like the English keywords in taxonomy.yaml (whole phrases, case-insensitive), so a Spanish or
# German site maps onto the same capability ids, and the evidence keeps the verbatim quote in the page's own
# language. Language-neutral terms (SSO, SAML, API, webhook, WhatsApp, GDPR, OCR, dashboard…) are already in
# taxonomy.yaml. Generic words that would cause false matches are deliberately left out.
# Languages: es (Spanish), fr (French), de (German), pt (Portuguese), it (Italian), nl (Dutch).


      review_themes: ["pricing"]
    industries: []
    current_process: "Invoices, payment reminders and reconciliation with accounting are handled manually or in spreadsheets."
    inefficiency: "Manual billing and reconciliation take finance time and cause late payments and errors."
    improvement: "Automated invoicing and dunning, online payment links and automatic reconciliation with the accounting system."
    how_it_works: "Usage or bookings generate invoices automatically; payment reminders escalate on schedule; payments are matched to invoices and synced to accounting."
    customer_impact: "Simpler, more transparent billing and payment."
    revenue: "Faster cash collection and fewer billing disputes."
    solution_features: ["billing.invoicing", "billing.payments"]
    benefits: {resource_saving: high, time_reduction: high, error_reduction: high}
    ai: false
    automation: true
    factors: {business_value: 4, user_impact: 2, revenue_potential: 3, strategic_alignment: 3, cost_saving: 4, productivity: 4, complexity: 3, risk: 2}

  - id: document_processing

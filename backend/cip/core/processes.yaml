      features: []
      review_themes: []
    industries: ["health", "insurance", "finance", "legal", "logistics", "real estate", "government", "education"]
    current_process: "Forms and documents are read and their data typed into systems by staff."
    inefficiency: "Re-keying document data is slow, repetitive and error-prone."
    improvement: "AI document processing that classifies documents, extracts the data and validates it before it enters the system."
    how_it_works: "Uploaded or emailed documents are classified, fields are extracted with OCR and language models, low-confidence values go to a person for review, and the data is posted to the system of record."

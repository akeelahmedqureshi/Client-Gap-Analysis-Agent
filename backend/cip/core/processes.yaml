    inefficiency: "Generic or late follow-ups lose prospects, and manual follow-up does not scale."
    improvement: "Behaviour-triggered nurture sequences with AI-personalised content and sales alerts for high-intent prospects."
    how_it_works: "Product and email activity trigger tailored sequences; an intent score alerts sales when a prospect is ready to talk."
    customer_impact: "Relevant, timely communication instead of generic newsletters."
    revenue: "More trials and subscribers converted to customers."
    solution_features: ["ai.recommendations", "platform.crm_integration"]

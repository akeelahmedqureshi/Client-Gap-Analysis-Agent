# Business-process catalog for cost-reduction, automation and AI opportunity analysis (BRS 7.12-7.13).
#
# A process is considered present at the client when public signals show it: keywords on the client's
# pages, capabilities it offers (taxonomy ids) or app-store review themes. Internal processes are not
# publicly observable, so `current_process` and `inefficiency` are always labelled as ASSUMPTIONS.
#
#   signals.keywords      phrases on the client's public pages that show the process exists
#   signals.features      client capabilities (available/partial) that imply the process
#   signals.review_themes app-review themes (connectors/research/appstore.py) that show pain in it
#   solution_features     taxonomy capabilities that implement the improvement; when the client already
#                         has all of them publicly, the opportunity is not raised
#   benefits              qualitative levels (low | medium | high); never invented percentages
#   factors               baseline 0-5 scores for prioritization (complexity/risk are penalties)
#   ai / automation       whether the improvement is an AI and/or automation opportunity
#   industries            industries where the process is especially relevant (raises confidence)
#
# Text may use {client} and {product}.

processes:
  - id: scheduling
    area: Scheduling
    name: Automated scheduling, reminders and rescheduling
    signals:
      keywords: ["appointment", "book online", "booking", "schedule a", "reservation", "book a visit", "bookings"]
      features: ["workflow.scheduling"]
      review_themes: ["notifications"]
    industries: ["health", "clinic", "dental", "salon", "fitness", "education", "hospitality", "services"]
    current_process: "Bookings are confirmed, reminded and rescheduled by staff, by phone or email."
    inefficiency: "Manual confirmations and reminders take staff time, and missed appointments leave unused capacity."
    improvement: "Automated multi-channel reminders (SMS and email), self-service rescheduling and waitlist backfill."
    how_it_works: "Booking events trigger reminder sequences; replies confirm, cancel or reschedule automatically and free slots are offered to the waitlist."
    customer_impact: "Fewer missed appointments and easier rescheduling for customers."
    revenue: "Recovered capacity from fewer no-shows and backfilled cancellations."
    solution_features: ["comm.sms", "workflow.automation"]
    benefits: {resource_saving: medium, time_reduction: high, error_reduction: medium}
    ai: false
    automation: true
    factors: {business_value: 4, user_impact: 4, revenue_potential: 3, strategic_alignment: 3, cost_saving: 4, productivity: 4, complexity: 2, risk: 1}

  - id: customer_support
    area: Customer support
    name: AI-assisted customer support and self-service
    signals:
      keywords: ["support", "help center", "faq", "contact us", "customer service", "live chat", "submit a ticket", "helpdesk"]
      features: ["comm.in_app_chat", "ux.self_service_portal"]
      review_themes: ["support", "login"]
    industries: []
    current_process: "Customer questions arrive by email, phone or chat and are answered one by one by the support team."
    inefficiency: "Repetitive questions consume support time, and answers are slower outside business hours."
    improvement: "An AI support assistant that answers common questions from approved help content, with ticket triage and hand-off to people."
    how_it_works: "A retrieval-based assistant answers from the help center and product documentation, classifies the remaining requests and routes them with context to the right person."
    customer_impact: "Instant answers at any hour; faster resolution for complex issues."
    revenue: "Retention from better support; support capacity freed for higher-value accounts."
    solution_features: ["ai.assistant", "ux.self_service_portal"]
    benefits: {resource_saving: high, time_reduction: high, error_reduction: low}
    ai: true
    automation: true
    factors: {business_value: 4, user_impact: 4, revenue_potential: 2, strategic_alignment: 4, cost_saving: 5, productivity: 4, complexity: 3, risk: 2}

  - id: lead_processing
    area: Lead processing
    name: Automated lead capture, qualification and routing
    signals:
      keywords: ["request a demo", "book a demo", "contact sales", "get a quote", "request a quote", "talk to sales", "free consultation", "get in touch"]
      features: []
      review_themes: []
    industries: []
    current_process: "Website enquiries arrive by form or email and are qualified and assigned by hand."
    inefficiency: "Slow manual qualification delays the first response, and leads can be missed or sit with the wrong person."
    improvement: "Automatic capture of enquiries into the CRM with AI lead scoring, instant acknowledgement and routing to the right salesperson."
    how_it_works: "Form and email enquiries are parsed into CRM records, enriched with public company data, scored against past wins and routed with a same-minute reply."
    customer_impact: "Prospects get an immediate, relevant response."
    revenue: "Higher conversion from faster follow-up on the best-fit leads."
    solution_features: ["platform.crm_integration", "ai.automation"]
    benefits: {resource_saving: medium, time_reduction: high, error_reduction: medium}
    ai: true
    automation: true
    factors: {business_value: 4, user_impact: 2, revenue_potential: 5, strategic_alignment: 4, cost_saving: 3, productivity: 4, complexity: 2, risk: 1}


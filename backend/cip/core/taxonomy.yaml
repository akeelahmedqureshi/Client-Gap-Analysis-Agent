        code_signals: ["langgraph", "crewai", "autogen", "openai-agents", "temporalio"]
        defaults: {business_value: 5, user_impact: 4, revenue_potential: 4, strategic_alignment: 5, ai_opportunity: 5, complexity: 4, risk: 3}
      - id: ai.recommendations
        name: AI recommendations / personalization
        keywords: ["recommendations", "personalized", "personalised", "suggested for you"]
        code_signals: ["scikit-learn", "sklearn", "lightfm", "implicit", "surprise", "recombee", "tensorflow-recommenders"]
        defaults: {business_value: 4, user_impact: 4, revenue_potential: 4, strategic_alignment: 4, ai_opportunity: 5, complexity: 4, risk: 2}
      - id: ai.predictive
        name: Predictive analytics
        keywords: ["predictive", "forecast", "prediction", "risk score", "churn prediction"]
        code_signals: ["prophet", "xgboost", "lightgbm", "statsmodels", "scikit-learn", "sklearn", "tensorflow", "torch", "pytorch"]
        defaults: {business_value: 4, user_impact: 3, revenue_potential: 4, strategic_alignment: 4, ai_opportunity: 5, complexity: 4, risk: 3}
      - id: ai.document_processing
        name: AI document processing / OCR
        keywords: ["ocr", "document extraction", "intelligent document", "scan documents", "auto-extract"]
        code_signals: ["tesseract", "pytesseract", "textract", "document-ai", "azure-ai-formrecognizer", "unstructured"]
        defaults: {business_value: 4, user_impact: 3, revenue_potential: 3, strategic_alignment: 3, ai_opportunity: 5, complexity: 3, risk: 2}
      - id: ai.voice
        name: Voice / speech AI
        keywords: ["voice assistant", "speech to text", "transcription", "voice commands"]
        code_signals: ["whisper", "deepgram", "assemblyai", "speechrecognition", "elevenlabs"]
        defaults: {business_value: 3, user_impact: 3, revenue_potential: 3, strategic_alignment: 3, ai_opportunity: 5, complexity: 3, risk: 2}


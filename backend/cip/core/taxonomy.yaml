        code_signals: ["langchain", "llamaindex", "llama-index", "haystack", "pgvector", "pinecone", "qdrant", "chromadb"]
        defaults: {business_value: 4, user_impact: 3, revenue_potential: 3, strategic_alignment: 4, ai_opportunity: 5, complexity: 3, risk: 3}
      - id: ai.automation
        name: AI workflow automation / agents

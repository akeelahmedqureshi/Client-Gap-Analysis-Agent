        code_signals: ["openai", "anthropic", "@anthropic-ai", "langchain", "llamaindex", "llama-index", "google-generativeai", "@google/generative-ai", "cohere", "mistralai", "ollama", "openrouter"]
        defaults: {business_value: 4, user_impact: 4, revenue_potential: 4, strategic_alignment: 5, ai_opportunity: 5, complexity: 3, risk: 3}
      - id: ai.search
        name: AI / semantic search
        keywords: ["ai search", "semantic search", "smart search", "natural language search"]
        code_signals: ["pgvector", "pinecone", "weaviate", "qdrant", "chromadb", "milvus", "faiss", "sentence-transformers", "embeddings"]
        defaults: {business_value: 3, user_impact: 4, revenue_potential: 3, strategic_alignment: 4, ai_opportunity: 5, complexity: 3, risk: 2}
      - id: ai.rag

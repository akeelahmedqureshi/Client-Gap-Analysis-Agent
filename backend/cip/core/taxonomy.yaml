# Normalized feature taxonomy.
#
# Every client and competitor feature is mapped onto these ids so that products
# can be compared like-for-like. Per feature:
#   keywords      phrases that, when found in website/docs text, indicate the feature
#   code_signals  dependency names or path fragments that indicate an implementation
#   defaults      baseline factor scores (0-5) used by the prioritization engine
#                 when no better estimate is available. complexity/risk are
#                 penalties (higher = harder / riskier).
#   ai            true when the feature is an AI capability (feeds AI-gap analysis);
#                 defaults to true for every feature in the "ai" category

categories:
  - id: authentication
    name: Authentication
    features:
      - id: auth.email_login
        name: Email / password login
        keywords: ["sign in", "log in", "login", "sign up", "create account"]
        code_signals: ["passport", "devise", "django.contrib.auth", "next-auth", "authlib", "bcrypt", "flask-login", "/auth/", "/login"]
        defaults: {business_value: 3, user_impact: 3, revenue_potential: 1, strategic_alignment: 2, ai_opportunity: 0, complexity: 1, risk: 2}
      - id: auth.oauth
        name: Social / OAuth login
        keywords: ["sign in with google", "continue with google", "sign in with microsoft", "oauth", "login with github"]
        code_signals: ["passport-google", "omniauth", "social-auth", "next-auth", "authlib", "oauth2", "@react-oauth"]
        defaults: {business_value: 2, user_impact: 3, revenue_potential: 1, strategic_alignment: 2, ai_opportunity: 0, complexity: 2, risk: 2}
      - id: auth.sso
        name: Enterprise SSO (SAML / OIDC)
        keywords: ["single sign-on", "sso", "saml", "okta", "azure ad", "entra id", "openid connect"]
        code_signals: ["saml", "python3-saml", "passport-saml", "ruby-saml", "oidc", "openid-client", "keycloak", "auth0", "workos"]
        defaults: {business_value: 4, user_impact: 3, revenue_potential: 4, strategic_alignment: 4, ai_opportunity: 0, complexity: 3, risk: 2}
      - id: auth.mfa
        name: Multi-factor authentication
        keywords: ["two-factor", "2fa", "multi-factor", "mfa", "authenticator app"]
        code_signals: ["pyotp", "speakeasy", "otplib", "rotp", "django-otp", "two_factor", "webauthn"]
        defaults: {business_value: 3, user_impact: 2, revenue_potential: 2, strategic_alignment: 4, ai_opportunity: 0, complexity: 2, risk: 1}
      - id: auth.rbac
        name: Roles & permissions (RBAC)
        keywords: ["roles and permissions", "role-based", "user roles", "access control", "permissions"]
        code_signals: ["casbin", "pundit", "cancancan", "django-guardian", "accesscontrol", "casl", "rbac"]
        defaults: {business_value: 4, user_impact: 3, revenue_potential: 3, strategic_alignment: 4, ai_opportunity: 0, complexity: 3, risk: 2}

  - id: communication
    name: Communication
    features:
      - id: comm.email
        name: Email notifications
        keywords: ["email notifications", "email reminders", "email alerts"]
        code_signals: ["nodemailer", "sendgrid", "@sendgrid", "mailgun", "postmark", "aws-sdk/client-ses", "actionmailer", "django.core.mail", "resend"]
        defaults: {business_value: 3, user_impact: 3, revenue_potential: 1, strategic_alignment: 2, ai_opportunity: 1, complexity: 1, risk: 1}
      - id: comm.sms
        name: SMS notifications
        keywords: ["sms", "text message", "text reminders"]
        code_signals: ["twilio", "vonage", "nexmo", "messagebird", "plivo"]
        defaults: {business_value: 3, user_impact: 3, revenue_potential: 2, strategic_alignment: 2, ai_opportunity: 0, complexity: 2, risk: 1}
      - id: comm.whatsapp
        name: WhatsApp messaging
        keywords: ["whatsapp"]
        code_signals: ["whatsapp", "twilio"]
        defaults: {business_value: 3, user_impact: 3, revenue_potential: 2, strategic_alignment: 3, ai_opportunity: 1, complexity: 2, risk: 2}
      - id: comm.video
        name: Video calls
        keywords: ["video call", "video consultation", "telehealth", "video conferencing", "virtual meeting"]
        code_signals: ["twilio-video", "agora", "daily-js", "@daily-co", "vonage-video", "zoom", "livekit", "webrtc", "jitsi"]
        defaults: {business_value: 4, user_impact: 4, revenue_potential: 3, strategic_alignment: 3, ai_opportunity: 2, complexity: 4, risk: 3}
      - id: comm.in_app_chat
        name: In-app chat / messaging
        keywords: ["live chat", "in-app messaging", "chat with", "secure messaging"]
        code_signals: ["socket.io", "pusher", "ably", "stream-chat", "sendbird", "intercom", "actioncable", "channels"]
        defaults: {business_value: 3, user_impact: 4, revenue_potential: 2, strategic_alignment: 3, ai_opportunity: 3, complexity: 3, risk: 2}
      - id: comm.push
        name: Push notifications
        keywords: ["push notification"]
        code_signals: ["firebase-admin", "onesignal", "expo-notifications", "web-push", "apns", "fcm"]
        defaults: {business_value: 3, user_impact: 3, revenue_potential: 1, strategic_alignment: 2, ai_opportunity: 1, complexity: 2, risk: 1}

